[package]
name = "anova_rs"
version = "0.0.3"
description = "TUI for minotoring and controlling ANOVA APC devices"
authors = ["OscarAspelin <oscar.asp@hotmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
# ratatui
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
ratatui = "0.30.2"
tokio = { version = "1.53.0", features = ["full"] }
color-eyre = "0.6.3"
strum = { version = "0.28.0", features = ["derive"] }

# anova stuff
dotenv = "0.15.0"
future-utils = "0.12.1"
futures-util = "0.3.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
validator = {version = "0.20.0", features = ["derive"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.6.2", features = ["derive"] }

[dev-dependencies]
rstest = "0.26.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
